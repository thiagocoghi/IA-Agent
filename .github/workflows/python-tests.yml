name: QA Pipeline - Pytest

on:
  push:
    branches: [ "main", "master", "update" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          # Instalamos o pytest e pydantic explicitamente caso o requirements falhe
          pip install pytest pydantic-settings httpx requests google-generativeai supabase
          # Tenta instalar o restante do arquivo se ele existir
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rodar Testes de Integração com Pytest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ZAPI_INSTANCE_ID: ${{ secrets.ZAPI_INSTANCE_ID }}
          ZAPI_INSTANCE_TOKEN: ${{ secrets.ZAPI_INSTANCE_TOKEN }}
          ZAPI_CLIENT_TOKEN: ${{ secrets.ZAPI_CLIENT_TOKEN }}
        run: |
          # Usamos 'python -m pytest' para garantir que ele olhe para o path correto
          python -m pytest tests/test_agent.py -s
