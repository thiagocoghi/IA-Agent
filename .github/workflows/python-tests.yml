name: QA Pipeline - Pytest

on:
  push:
    branches: [ "main", "master", "update" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
            python -m pip install --upgrade pip
            # Removemos qualquer resquício do pacote 'google' genérico antes
            pip uninstall google -y || true
            # Instalamos a biblioteca oficial do Gemini
            pip install google-generativeai
            # Instalamos o restante das dependências necessárias
            pip install pytest pydantic-settings httpx requests supabase
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rodar Testes de Integração com Pytest
        env:
            PYTHONPATH: ${{ github.workspace }}
            GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
            SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
            ZAPI_INSTANCE_ID: ${{ secrets.ZAPI_INSTANCE_ID }}
            ZAPI_INSTANCE_TOKEN: ${{ secrets.ZAPI_INSTANCE_TOKEN }}
            ZAPI_CLIENT_TOKEN: ${{ secrets.ZAPI_CLIENT_TOKEN }}
        run: |
            # Adicionamos um check de debug para garantir que o genai está acessível
            python -c "from google import genai; print('✅ SDK do Google carregado com sucesso!')"
            python -m pytest tests/test_agent.py -s