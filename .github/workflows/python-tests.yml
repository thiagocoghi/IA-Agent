name: QA Pipeline - Stability & Integration

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Instalar dependências
        run: |
            python -m pip install --upgrade pip
            pip install pytest pytest-cov pydantic-settings httpx requests supabase holidays google-genai
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validar Estrutura de Pastas (QA Debug)
        run: |
            echo "📂 Estrutura do projeto:"
            ls -R

      # --- CONFIGURAÇÃO FRONTEND (NODE/VITE) ---
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Versão recomendada no seu lockfile
          cache: 'npm'

      - name: Instalar dependências Web (Vite/Supabase)
        run: npm install

      - name: Rodar Testes de Integração
        env:
          # Define a pasta 'app' como base para os imports do Python
          PYTHONPATH: ${{ github.workspace }}/app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAPI_INSTANCE_ID: ${{ secrets.ZAPI_INSTANCE_ID }}
          ZAPI_INSTANCE_TOKEN: ${{ secrets.ZAPI_INSTANCE_TOKEN }}
          ZAPI_CLIENT_TOKEN: ${{ secrets.ZAPI_CLIENT_TOKEN }}
        run: |
            # Executa apenas os testes de Python na pasta correta
            python -m pytest tests/python --cov=app --cov-report=term-missing -s