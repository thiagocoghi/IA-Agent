<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Login - Acesso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div id="login-screen" class="card login-card">
        <h2 style="color: var(--pink-primary)">🌸 Bella Login</h2>
        <p>Acesse o painel da sua clínica</p>

        <div class="input-group">
            <input type="email" id="login-email" placeholder="E-mail profissional">
            <input type="password" id="login-password" placeholder="Sua senha">
        </div>

        <button id="btn-login" class="primary" style="width: 100%;">Entrar no Sistema</button>
        <p id="error-msg" style="color: #ff6b6b; font-size: 0.8rem; margin-top: 15px;"></p>
        <div class="form-footer" style="margin-top: 15px; text-align: center;">
            <p>Não tem uma conta? <a href="cadastro.html">Cadastre sua clínica aqui</a></p>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
