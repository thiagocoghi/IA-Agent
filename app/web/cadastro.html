<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella SaaS - Novo Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>🌸 Criar Nova Conta</h1>
        <p>Comece a gerenciar sua clínica agora.</p>

        <form id="form-cadastro">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="cad-nome" placeholder="Seu nome" required>
            </div>
            <div class="form-group">
                <label>Nome da Clínica/Empresa</label>
                <input type="text" id="cad-empresa" placeholder="Ex: Bella Estética" required>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="cad-email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label>Senha (mín. 6 caracteres)</label>
                <input type="password" id="cad-password" placeholder="******" required>
            </div>
            <button type="submit" class="primary">Finalizar Cadastro</button>
        </form>

        <p class="footer-link"><a href="index.html">Já tenho conta? Entrar</a></p>
    </div>
    <script type="module" src="/cadastro.js"></script>
</body>
</html>
